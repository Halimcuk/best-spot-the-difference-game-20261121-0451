<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Lane — Spot the Difference</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="title-block">
      <h1>Lantern Lane</h1>
      <p class="tagline">Spot the Difference &middot; an original picture hunt</p>
    </div>
    <div class="hud-stats">
      <div class="stat"><span class="stat-label">Level</span><span class="stat-value" id="hud-level">1 / 3</span></div>
      <div class="stat"><span class="stat-label">Found</span><span class="stat-value" id="hud-found">0 / 7</span></div>
      <div class="stat"><span class="stat-label">Left</span><span class="stat-value" id="hud-left">7 left</span></div>
      <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="hud-score">0</span></div>
      <div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="hud-time">2:30</span></div>
      <div class="stat"><span class="stat-label">Hints</span><span class="stat-value" id="hud-hints">3</span></div>
    </div>
  </header>

  <div id="scene-bar">
    <span id="scene-name">Night Market Lane</span>
    <span id="scene-blurb">Seven small things changed between the two pictures. Find them all before the lanterns burn out.</span>
  </div>

  <main id="boards">
    <figure class="panel">
      <canvas id="panel-left" width="600" height="450"></canvas>
      <figcaption>Original</figcaption>
    </figure>
    <div id="divider" aria-hidden="true"><span>VS</span></div>
    <figure class="panel">
      <canvas id="panel-right" width="600" height="450"></canvas>
      <figcaption>Spot the changes</figcaption>
    </figure>
  </main>

  <div id="progress-dots" aria-label="Differences found"></div>

  <footer id="controls">
    <button id="btn-hint" type="button">Hint (H) &middot; reveals one</button>
    <button id="btn-restart" type="button">Restart level (R)</button>
    <button id="btn-sound" type="button">Sound: on</button>
    <button id="btn-menu" type="button">Levels</button>
    <span id="message" role="status"></span>
  </footer>

  <div id="overlay" class="overlay">
    <div class="overlay-card" id="overlay-card"></div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
